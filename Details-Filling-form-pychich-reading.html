<!DOCTYPE html>
<html lang="en">
<head>
   <meta charset="UTF-8">
   <meta name="viewport" content="width=device-width, initial-scale=1.0">
   <title>Souls Key - Booking Form</title>
   <script src="https://cdn.tailwindcss.com"></script>
   <link rel="preconnect" href="https://fonts.googleapis.com">
   <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
   <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@400;700&display=swap" rel="stylesheet">
   <style>
       body {
           font-family: 'Inter', sans-serif;
           background-color: #000;
       }
       .font-serif {
           font-family: 'Playfair Display', serif;
       }
       .file-input-label {
           cursor: pointer;
           transition: all 0.2s ease-in-out;
       }
       .file-input-label:hover {
           border-color: #a78bfa; /* violet-300 for hover */
       }
       input[type="date"]::-webkit-calendar-picker-indicator {
           filter: invert(1);
       }
       input[type="time"]::-webkit-calendar-picker-indicator {
           filter: invert(1);
       }
       .form-container {
           background-color: rgba(17, 24, 39, 0.7); /* gray-900 with 70% opacity */
           backdrop-filter: blur(10px);
           -webkit-backdrop-filter: blur(10px);
           border: 1px solid rgba(129, 140, 153, 0.2); /* gray-500 with 20% opacity */
       }
   </style>
</head>
<body class="text-white">
   <div class="container mx-auto p-4 md:p-8 flex items-center justify-center min-h-screen">
       <!-- Form container, styled to match the original modal card -->
       <div class="form-container rounded-2xl shadow-2xl w-full max-w-md p-8">
           <h2 class="text-3xl font-serif text-center mb-2">Your Path to Clarity Starts Here</h2>
           <p class="text-center text-gray-400 mb-8">Please fill in your details to book your session.</p>


           <!-- Form -->
           <form id="psychic-reading-form" class="space-y-5">
              
               <!-- Full Name -->
               <div>
                   <label for="fullName" class="block text-sm font-medium text-gray-300 mb-1">Full Name</label>
                   <input type="text" id="fullName" name="fullName" required class="w-full bg-gray-800/50 border border-gray-600 rounded-lg p-3 text-white focus:ring-2 focus:ring-amber-500 focus:border-amber-500 transition">
               </div>


               <!-- Email Address -->
               <div>
                   <label for="email" class="block text-sm font-medium text-gray-300 mb-1">Email Address</label>
                   <input type="email" id="email" name="email" required class="w-full bg-gray-800/50 border border-gray-600 rounded-lg p-3 text-white focus:ring-2 focus:ring-amber-500 focus:border-amber-500 transition">
               </div>


               <!-- Date of Birth -->
               <div>
                   <label for="dob" class="block text-sm font-medium text-gray-300 mb-1">Date of Birth</label>
                   <input type="date" id="dob" name="dob" required class="w-full bg-gray-800/50 border border-gray-600 rounded-lg p-3 text-white focus:ring-2 focus:ring-amber-500 focus:border-amber-500 transition appearance-none">
               </div>


               <!-- Place of Birth -->
               <div>
                   <label for="placeOfBirth" class="block text-sm font-medium text-gray-300 mb-1">Place of Birth (City, Country)</label>
                   <input type="text" id="placeOfBirth" name="placeOfBirth" required class="w-full bg-gray-800/50 border border-gray-600 rounded-lg p-3 text-white focus:ring-2 focus:ring-amber-500 focus:border-amber-500 transition">
               </div>
              
               <!-- Time of Birth -->
               <div>
                   <label for="timeOfBirth" class="block text-sm font-medium text-gray-300 mb-1">Time of Birth</label>
                   <input type="time" id="timeOfBirth" name="timeOfBirth" class="w-full bg-gray-800/50 border border-gray-600 rounded-lg p-3 text-white focus:ring-2 focus:ring-amber-500 focus:border-amber-500 transition">
               </div>


               <!-- Phone Number -->
               <div>
                   <label for="phone" class="block text-sm font-medium text-gray-300 mb-1">Phone Number</label>
                   <div class="flex">
                       <select id="countryCode" name="countryCode" class="bg-gray-800/50 border border-gray-600 rounded-l-lg p-3 text-white focus:ring-2 focus:ring-amber-500 focus:border-amber-500 transition">
                           <option value="+1">+1 (USA/Canada)</option>
                           <option value="+91" selected>+91 (India)</option>
                           <option value="+86">+86 (China)</option>
                           <option value="+62">+62 (Indonesia)</option>
                           <option value="+92">+92 (Pakistan)</option>
                           <option value="+234">+234 (Nigeria)</option>
                           <option value="+55">+55 (Brazil)</option>
                           <option value="+880">+880 (Bangladesh)</option>
                           <option value="+7">+7 (Russia)</option>
                           <option value="+81">+81 (Japan)</option>
                           <option value="+63">+63 (Philippines)</option>
                           <option value="+20">+20 (Egypt)</option>
                           <option value="+60">+60 (Malaysia)</option>
                           <option value="+65">+65 (Singapore)</option>
                           <option value="+49">+49 (Germany)</option>
                           <option value="+44">+44 (UK)</option>
                           <option value="+33">+33 (France)</option>
                           <option value="+39">+39 (Italy)</option>
                           <option value="+34">+34 (Spain)</option>
                           <option value="+52">+52 (Mexico)</option>
                           <option value="+90">+90 (Turkey)</option>
                           <option value="+27">+27 (South Africa)</option>
                           <option value="+82">+82 (South Korea)</option>
                           <option value="+31">+31 (Netherlands)</option>
                           <option value="+94">+94 (Sri Lanka)</option>
                           <option value="+66">+66 (Thailand)</option>
                           <option value="+93">+93 (Afghanistan)</option>
                           <option value="+95">+95 (Myanmar)</option>
                           <option value="+254">+254 (Kenya)</option>
                           <option value="+237">+237 (Cameroon)</option>
                           <option value="+243">+243 (DRC)</option>
                           <option value="+351">+351 (Portugal)</option>
                           <option value="+48">+48 (Poland)</option>
                           <option value="+40">+40 (Romania)</option>
                           <option value="+46">+46 (Sweden)</option>
                           <option value="+47">+47 (Norway)</option>
                           <option value="+45">+45 (Denmark)</option>
                           <option value="+41">+41 (Switzerland)</option>
                           <option value="+43">+43 (Austria)</option>
                           <option value="+32">+32 (Belgium)</option>
                           <option value="+358">+358 (Finland)</option>
                           <option value="+353">+353 (Ireland)</option>
                           <option value="+30">+30 (Greece)</option>
                           <option value="+420">+420 (Czech Republic)</option>
                           <option value="+36">+36 (Hungary)</option>
                           <option value="+966">+966 (Saudi Arabia)</option>
                           <option value="+971">+971 (UAE)</option>
                           <option value="+964">+964 (Iraq)</option>
                           <option value="+98">+98 (Iran)</option>
                           <option value="+961">+961 (Lebanon)</option>
                           <option value="+972">+972 (Israel)</option>
                       </select>
                       <input type="tel" id="phone" name="phone" required placeholder="Your phone number" class="w-full bg-gray-800/50 border-r border-t border-b border-gray-600 rounded-r-lg p-3 text-white focus:ring-2 focus:ring-amber-500 focus:border-amber-500 transition">
                   </div>
               </div>
              
               <!-- Areas of Concern -->
               <div>
                   <label for="concerns" class="block text-sm font-medium text-gray-300 mb-1">Areas of Concern</label>
                   <textarea id="concerns" name="concerns" rows="4" placeholder="Tell us what's on your mind (e.g., career, relationships, life path)..." class="w-full bg-gray-800/50 border border-gray-600 rounded-lg p-3 text-white focus:ring-2 focus:ring-amber-500 focus:border-amber-500 transition"></textarea>
               </div>


               <!-- Photo Upload -->
               <div>
                    <label class="block text-sm font-medium text-gray-300 mb-2">Upload Photo</label>
                    <label for="photo" class="file-input-label flex items-center justify-center w-full p-4 bg-gray-800/50 border-2 border-dashed border-gray-600 rounded-lg">
                        <div class="text-center">
                            <svg xmlns="http://www.w3.org/2000/svg" class="mx-auto h-10 w-10 text-gray-400" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12" />
                            </svg>
                            <p class="mt-2 text-sm text-gray-400"><span class="font-semibold text-amber-400">Click to upload</span> or drag and drop</p>
                            <p class="text-xs text-gray-500">PNG, JPG, GIF up to 5MB</p>
                            <p class="text-xs text-gray-500 mt-1">Your photo will be used for strictly consulting purposes and kept confidential.</p>
                        </div>
                    </label>
                    <input type="file" id="photo" name="photo" accept="image/*" class="hidden">
                    <p id="fileNameDisplay" class="text-sm text-gray-400 mt-2"></p>
               </div>


               <!-- Submit Button -->
               <div class="pt-4">
                   <button type="submit" class="w-full bg-gradient-to-r from-amber-600 to-blue-800 hover:opacity-90 text-white font-bold py-3 px-6 rounded-full transition-all duration-300 text-lg shadow-lg">
                       Submit & Proceed to Payment
                   </button>
               </div>
           </form>
       </div>
   </div>

   <script type="module">
    // Import Firebase SDKs
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
    import { getFirestore, collection, addDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
    import { getStorage, ref, uploadBytes, getDownloadURL } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-storage.js";

    // Your Firebase config (replace with your actual config)
    const firebaseConfig = {
        apiKey: "AIzaSyCr2e1fItelEcjtomC6V8RryqyCqaSEgMM",
        authDomain: "divyadrusti-website.firebaseapp.com",
        projectId: "divyadrusti-website",
        storageBucket: "divyadrusti-website.appspot.com",
        messagingSenderId: "51569335615",
        appId: "1:51569335615:web:f7a444ddc1a0e47533078a"
    };

    // Initialize Firebase
    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const storage = getStorage(app);

    const form = document.getElementById('psychic-reading-form');
    const photoInput = document.getElementById('photo');

    form.addEventListener('submit', async (e) => {
        e.preventDefault();

        const formData = new FormData(form);

        // Prepare data object
        const data = {
            fullName: formData.get('fullName'),
            email: formData.get('email'),
            dob: formData.get('dob'),
            placeOfBirth: formData.get('placeOfBirth'),
            timeOfBirth: formData.get('timeOfBirth'),
            countryCode: formData.get('countryCode'),
            phone: formData.get('phone'),
            concerns: formData.get('concerns'),
            createdAt: new Date().toISOString()
        };

        // Handle photo upload if a file is selected
        const photoFile = formData.get('photo');
        if (photoFile && photoFile.size > 0) {
            try {
                const storageRef = ref(storage, `psychic_photos/${Date.now()}_${photoFile.name}`);
                await uploadBytes(storageRef, photoFile);
                const photoURL = await getDownloadURL(storageRef);
                data.photoURL = photoURL;
            } catch (err) {
                alert("Photo upload failed: " + err.message);
                return;
            }
        }

        try {
            await addDoc(collection(db, "psychic_bookings"), data);
            alert("Booking submitted! Redirecting to payment...");
            // Redirect to payment page
            // window.location.href = 'https://your-payment-link.com';
        } catch (error) {
            alert("Error submitting booking: " + error.message);
        }
    });
</script>

</body>
</html>
